<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Market Indices | Live Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #141b2d;
      --surface-hover: #1a2338;
      --border: #243049;
      --text: #e8edf5;
      --text-muted: #8b9bb4;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Subtle animated gradient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(59, 130, 246, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139, 92, 246, 0.1), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--surface);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }

    .status-dot.live {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    .status-dot.error {
      background: var(--red);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    /* Region tabs */
    .regions {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .region-tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .region-tab:hover {
      color: var(--text);
      border-color: #3a4a6a;
    }

    .region-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      background: var(--surface-hover);
      border-color: #2e3f5e;
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: transparent;
      transition: background 0.3s;
    }

    .card.up::before { background: var(--green); }
    .card.down::before { background: var(--red); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .card-title {
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .card-symbol {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-family: ui-monospace, monospace;
    }

    .card-region {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .price {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .change-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .change {
      font-size: 0.95rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .change.up {
      color: var(--green);
      background: var(--green-bg);
    }

    .change.down {
      color: var(--red);
      background: var(--red-bg);
    }

    .change-abs {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .meta-item label {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 2px;
    }

    .meta-item span {
      font-size: 0.88rem;
      font-weight: 500;
    }

    /* Skeleton loading */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-hover) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-title { height: 18px; width: 60%; margin-bottom: 6px; }
    .skeleton-symbol { height: 12px; width: 30%; }
    .skeleton-price { height: 32px; width: 50%; margin: 14px 0 8px; }
    .skeleton-change { height: 22px; width: 40%; margin-bottom: 16px; }
    .skeleton-meta { height: 14px; width: 80%; }

    /* Footer */
    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Error banner */
    .error-banner {
      background: var(--red-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .error-banner.show {
      display: block;
    }

    /* Empty state */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.35rem; }
      .price { font-size: 1.5rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">📊</div>
        <div>
          <h1>World Market Indices</h1>
          <p class="subtitle">Live data via Yahoo Finance (unofficial API)</p>
        </div>
      </div>
      <div class="controls">
        <div class="status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Connecting…</span>
        </div>
        <button class="btn" id="refreshBtn" onclick="loadData(true)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          Refresh
        </button>
      </div>
    </header>

    <div class="error-banner" id="errorBanner"></div>

    <div class="regions" id="regionTabs">
      <button class="region-tab active" data-region="all">All</button>
      <button class="region-tab" data-region="Americas">Americas</button>
      <button class="region-tab" data-region="Europe">Europe</button>
      <button class="region-tab" data-region="Asia-Pacific">Asia-Pacific</button>
    </div>

    <div class="grid" id="grid">
      <!-- Cards injected by JS -->
    </div>

    <footer>
      <p>
        Data provided by Yahoo Finance unofficial endpoints · Not for trading decisions ·
        Auto-refreshes every 60 seconds ·
        <span id="lastUpdate">—</span>
      </p>
    </footer>
  </div>

  <script>
    // Major world indices with Yahoo symbols and regions
    const INDICES = [
      // Americas
      { symbol: '^GSPC',   name: 'S&P 500',              region: 'Americas' },
      { symbol: '^DJI',    name: 'Dow Jones Industrial', region: 'Americas' },
      { symbol: '^IXIC',   name: 'Nasdaq Composite',     region: 'Americas' },
      { symbol: '^RUT',    name: 'Russell 2000',         region: 'Americas' },
      { symbol: '^GSPTSE', name: 'S&P/TSX Composite',    region: 'Americas' },
      { symbol: '^BVSP',   name: 'Bovespa (Brazil)',     region: 'Americas' },
      // Europe
      { symbol: '^FTSE',     name: 'FTSE 100',           region: 'Europe' },
      { symbol: '^GDAXI',    name: 'DAX',                region: 'Europe' },
      { symbol: '^FCHI',     name: 'CAC 40',             region: 'Europe' },
      { symbol: '^STOXX50E', name: 'Euro Stoxx 50',      region: 'Europe' },
      // Asia-Pacific
      { symbol: '^N225',     name: 'Nikkei 225',         region: 'Asia-Pacific' },
      { symbol: '^HSI',      name: 'Hang Seng',          region: 'Asia-Pacific' },
      { symbol: '000001.SS', name: 'Shanghai Composite', region: 'Asia-Pacific' },
      { symbol: '^BSESN',    name: 'BSE Sensex',         region: 'Asia-Pacific' },
      { symbol: '^NSEI',     name: 'Nifty 50',           region: 'Asia-Pacific' },
      { symbol: '^AXJO',     name: 'S&P/ASX 200',        region: 'Asia-Pacific' },
      { symbol: '^KS11',     name: 'KOSPI',              region: 'Asia-Pacific' },
    ];

    let currentRegion = 'all';
    let cache = {};
    let refreshTimer = null;

    // Format helpers
    function fmtNumber(n, decimals = 2) {
      if (n == null || isNaN(n)) return '—';
      return Number(n).toLocaleString('en-US', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function fmtChange(n) {
      if (n == null || isNaN(n)) return '—';
      const sign = n > 0 ? '+' : '';
      return sign + fmtNumber(n);
    }

    function fmtPercent(n) {
      if (n == null || isNaN(n)) return '—';
      const sign = n > 0 ? '+' : '';
      return sign + fmtNumber(n) + '%';
    }

    function fmtVolume(n) {
      if (n == null || isNaN(n) || n === 0) return '—';
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return n.toString();
    }

    function timeAgo(ts) {
      if (!ts) return '';
      const diff = Math.floor(Date.now() / 1000 - ts);
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return new Date(ts * 1000).toLocaleString();
    }

    // Fetch single index via chart endpoint (uses CORS proxy for browser compatibility)
    async function fetchIndex(symbol) {
      const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=1d`;
      // Primary: direct (works in some environments / server-side)
      // Fallback: public CORS proxy so the page works when opened in a browser
      const urls = [
        yahooUrl,
        `https://corsproxy.io/?${encodeURIComponent(yahooUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(yahooUrl)}`
      ];

      let lastError;
      for (const url of urls) {
        try {
          const res = await fetch(url, {
            headers: { 'User-Agent': 'Mozilla/5.0' }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const result = data?.chart?.result?.[0];
          if (!result) throw new Error('No data');
          return result.meta;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('All fetch methods failed');
    }

    // Render skeleton cards
    function renderSkeletons() {
      const grid = document.getElementById('grid');
      grid.innerHTML = INDICES.map(() => `
        <div class="card">
          <div class="card-header">
            <div>
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-symbol"></div>
            </div>
          </div>
          <div class="skeleton skeleton-price"></div>
          <div class="skeleton skeleton-change"></div>
          <div class="meta">
            <div class="meta-item"><div class="skeleton skeleton-meta"></div></div>
            <div class="meta-item"><div class="skeleton skeleton-meta"></div></div>
          </div>
        </div>
      `).join('');
    }

    // Render cards from cache / data
    function renderCards(dataMap) {
      const grid = document.getElementById('grid');
      const filtered = currentRegion === 'all'
        ? INDICES
        : INDICES.filter(i => i.region === currentRegion);

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">No indices in this region</div>';
        return;
      }

      grid.innerHTML = filtered.map(idx => {
        const meta = dataMap[idx.symbol];
        if (!meta) {
          return `
            <div class="card">
              <div class="card-header">
                <div>
                  <div class="card-title">${idx.name}</div>
                  <div class="card-symbol">${idx.symbol}</div>
                </div>
                <span class="card-region">${idx.region}</span>
              </div>
              <div style="color:var(--text-muted);padding:20px 0">Failed to load</div>
            </div>`;
        }

        const price = meta.regularMarketPrice ?? meta.fulldayPrice;
        const changePct = meta.regularMarketChangePercent ?? meta.fulldayChangePercent ?? 0;
        const changeAbs = meta.fulldayChange ?? (price - (meta.chartPreviousClose || price));
        const isUp = changePct > 0;
        const isDown = changePct < 0;
        const cls = isUp ? 'up' : isDown ? 'down' : '';

        return `
          <div class="card ${cls}">
            <div class="card-header">
              <div>
                <div class="card-title">${meta.longName || meta.shortName || idx.name}</div>
                <div class="card-symbol">${idx.symbol}</div>
              </div>
              <span class="card-region">${idx.region}</span>
            </div>
            <div class="price">${fmtNumber(price)}</div>
            <div class="change-row">
              <span class="change ${cls}">${fmtPercent(changePct)}</span>
              <span class="change-abs">${fmtChange(changeAbs)}</span>
            </div>
            <div class="meta">
              <div class="meta-item">
                <label>Day High</label>
                <span>${fmtNumber(meta.regularMarketDayHigh)}</span>
              </div>
              <div class="meta-item">
                <label>Day Low</label>
                <span>${fmtNumber(meta.regularMarketDayLow)}</span>
              </div>
              <div class="meta-item">
                <label>Prev Close</label>
                <span>${fmtNumber(meta.chartPreviousClose)}</span>
              </div>
              <div class="meta-item">
                <label>52W Range</label>
                <span>${fmtNumber(meta.fiftyTwoWeekLow)} – ${fmtNumber(meta.fiftyTwoWeekHigh)}</span>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    // Main load function
    async function loadData(manual = false) {
      const btn = document.getElementById('refreshBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const errorBanner = document.getElementById('errorBanner');

      if (manual) {
        btn.classList.add('loading');
      }

      if (Object.keys(cache).length === 0) {
        renderSkeletons();
      }

      statusDot.className = 'status-dot';
      statusText.textContent = 'Updating…';
      errorBanner.classList.remove('show');

      const results = {};
      const errors = [];

      // Parallel fetch with concurrency limit
      const concurrency = 6;
      for (let i = 0; i < INDICES.length; i += concurrency) {
        const batch = INDICES.slice(i, i + concurrency);
        const promises = batch.map(async (idx) => {
          try {
            const meta = await fetchIndex(idx.symbol);
            results[idx.symbol] = meta;
          } catch (err) {
            errors.push(idx.symbol);
            console.warn(`Failed ${idx.symbol}:`, err.message);
          }
        });
        await Promise.all(promises);
      }

      cache = { ...cache, ...results };
      renderCards(cache);

      const now = new Date();
      document.getElementById('lastUpdate').textContent =
        'Last updated: ' + now.toLocaleTimeString();

      if (errors.length > 0 && Object.keys(results).length === 0) {
        statusDot.className = 'status-dot error';
        statusText.textContent = 'Failed to load';
        errorBanner.textContent = 'Unable to fetch data from Yahoo Finance. The unofficial API may be temporarily unavailable or blocked. Try again later.';
        errorBanner.classList.add('show');
      } else {
        statusDot.className = 'status-dot live';
        statusText.textContent = 'Live';
        if (errors.length > 0) {
          errorBanner.textContent = `Some indices failed to load: ${errors.join(', ')}`;
          errorBanner.classList.add('show');
        }
      }

      btn.classList.remove('loading');
    }

    // Region filter
    document.getElementById('regionTabs').addEventListener('click', (e) => {
      if (!e.target.classList.contains('region-tab')) return;
      document.querySelectorAll('.region-tab').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      currentRegion = e.target.dataset.region;
      renderCards(cache);
    });

    // Init
    loadData();
    refreshTimer = setInterval(() => loadData(false), 60000);

    // Clean up on page hide
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(refreshTimer);
      } else {
        loadData(false);
        refreshTimer = setInterval(() => loadData(false), 60000);
      }
    });
  </script>
</body>
</html>
